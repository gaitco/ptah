@props({"name": "", "type": "text", "value": "", "placeholder": "", "required": false})
<input
  type="{{ type }}"
  name="{{ name }}"
  id="{{ name }}"
  value="{{ value }}"
  placeholder="{{ placeholder }}"
  @if(required) required @endif
  class="block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm dark:bg-white/5 dark:text-white dark:ring-white/10">
